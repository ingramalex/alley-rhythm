<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alley Rhythm — Retro Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;600;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ALLEY RHYTHM — RETRO ARCADE THEME
   CRT · Pixel borders · Neon glow · Cabinet DNA
═══════════════════════════════════════════ */
:root {
  --void:       #01030a;
  --deep:       #060914;
  --panel:      #0a0e1a;
  --panel2:     #0f1424;
  --groove:     #151c30;
  --rail:       #1e2840;
  --rail2:      #283450;

  /* Neons */
  --neon-g:     #39ff14;   /* classic arcade green */
  --neon-g2:    #22cc00;
  --neon-p:     #ff00ff;   /* magenta */
  --neon-p2:    #cc00cc;
  --neon-y:     #ffe600;   /* yellow */
  --neon-y2:    #ccb800;
  --neon-c:     #00ffff;   /* cyan */
  --neon-c2:    #00cccc;
  --neon-o:     #ff6600;   /* orange */

  --text:       #d0e8ff;
  --text2:      #8aa0c8;
  --dim:        #3a4a68;
  --radius-px:  4px;       /* pixel-sharp corners */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

html {
  height: 100%;
  overflow: hidden;
  /* Prevent the entire page from rubber-band scrolling on iOS */
  overscroll-behavior: none;
  -webkit-overflow-scrolling: auto;
}

body {
  background: var(--void);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

/* Wrapper that fills the full screen as a flex column */
#app-shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
}

/* Top block stays fixed at top */
#top-block {
  flex-shrink: 0;
  position: relative;
  z-index: 300;
}

/* Scrollable content area fills remaining space */
#scroll-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  /* Contain scroll within this element — stops bounce propagating to parent */
  overscroll-behavior-y: contain;
}

/* Footer stays pinned at bottom */
#footer-block {
  flex-shrink: 0;
  position: relative;
  z-index: 200;
}

/* ── CRT OVERLAY ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 1000;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* ── SCREEN VIGNETTE ── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 999;
  background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 60%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}

/* ── PIXEL BORDER UTILITY ── */
.px-border {
  border: 2px solid;
  image-rendering: pixelated;
}

/* ── NEON TEXT GLOW ── */
.glow-g  { text-shadow: 0 0 8px var(--neon-g), 0 0 20px var(--neon-g), 0 0 40px var(--neon-g2); }
.glow-p  { text-shadow: 0 0 8px var(--neon-p), 0 0 20px var(--neon-p), 0 0 40px var(--neon-p2); }
.glow-y  { text-shadow: 0 0 8px var(--neon-y), 0 0 20px var(--neon-y); }
.glow-c  { text-shadow: 0 0 8px var(--neon-c), 0 0 20px var(--neon-c); }

/* ═══════════ MARQUEE TICKER ═══════════ */
.marquee-wrap {
  background: var(--void);
  border-bottom: 2px solid var(--neon-y2);
  overflow: hidden;
  height: 28px;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 100;
}
.marquee-wrap::before,
.marquee-wrap::after {
  content: '';
  position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2;
}
.marquee-wrap::before { left: 0; background: linear-gradient(90deg, var(--void), transparent); }
.marquee-wrap::after  { right: 0; background: linear-gradient(-90deg, var(--void), transparent); }

.marquee-track {
  display: flex;
  gap: 0;
  animation: marquee 28s linear infinite;
  white-space: nowrap;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.marquee-item {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--neon-y);
  padding: 0 28px;
  letter-spacing: 1px;
}
.marquee-item::before { content: '★  '; }

/* ═══════════ HEADER ═══════════ */
.site-header {
  position: sticky; top: 0; z-index: 200;
  background: var(--deep);
  border-bottom: 3px solid var(--neon-g2);
  box-shadow: 0 0 30px rgba(57,255,20,0.15), 0 4px 0 var(--neon-g2);
}

.header-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 16px;
  display: flex; align-items: center;
  height: 66px; gap: 0;
}

/* LOGO */
.logo-wrap {
  display: flex; flex-direction: column;
  justify-content: center;
  padding-right: 20px;
  border-right: 2px solid var(--rail2);
  gap: 3px;
}

.logo-line1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2), 0 0 40px var(--neon-g2);
}

.logo-line2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 8px;
  letter-spacing: 4px;
  color: var(--neon-p);
  text-shadow: 0 0 8px var(--neon-p), 0 0 16px var(--neon-p2);
  text-transform: uppercase;
}

/* LIVE SCORE READOUTS */
.header-readouts {
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  gap: 0;
  border-right: 2px solid var(--rail2);
}

.readout {
  padding: 6px 16px;
  text-align: center;
  border-right: 1px solid var(--rail);
  position: relative;
}
.readout:last-child { border-right: none; }

.readout-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2);
}
.readout-val.hot { color: var(--neon-p); text-shadow: 0 0 10px var(--neon-p), 0 0 20px var(--neon-p2); }
.readout-val.warm { color: var(--neon-y); text-shadow: 0 0 10px var(--neon-y), 0 0 16px var(--neon-y2); }
.readout-val.ice { color: var(--neon-c); text-shadow: 0 0 10px var(--neon-c), 0 0 16px var(--neon-c2); }

.readout-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-top: 3px;
  text-transform: uppercase;
}

.header-spacer { flex: 1; }

.insert-btn {
  margin-right: 16px;
  background: var(--neon-g);
  color: var(--void);
  border: none;
  border-radius: var(--radius-px);
  padding: 10px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 0 0 20px rgba(57,255,20,0.3), 3px 3px 0 var(--neon-g2);
  text-transform: uppercase;
  line-height: 1.4;
}
.insert-btn:hover {
  box-shadow: 0 0 30px rgba(57,255,20,0.6), 3px 3px 0 var(--neon-g2);
  transform: translate(-1px,-1px);
}
.insert-btn:active {
  transform: translate(2px,2px);
  box-shadow: 0 0 10px rgba(57,255,20,0.3), 1px 1px 0 var(--neon-g2);
}

/* ═══════════ NAV ═══════════ */
.nav-bar {
  background: var(--panel);
  border-bottom: 2px solid var(--rail2);
  display: flex;
  overflow-x: auto; scrollbar-width: none;
  position: sticky;
  top: 78px;   /* sits just below the site-header height */
  z-index: 190;
}
.nav-bar::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--neon-g2) 0%, var(--neon-p2) 50%, var(--neon-c2) 100%);
  opacity: 0.4;
}
.nav-bar::-webkit-scrollbar { display: none; }

.nav-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; width: 100%; padding: 0 16px;
}

.ntab {
  padding: 12px 20px;
  background: none; border: none;
  border-bottom: 3px solid transparent;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim);
  cursor: pointer; white-space: nowrap;
  transition: all 0.15s;
  margin-bottom: -2px;
}
.ntab:hover { color: var(--text2); }
.ntab.active {
  color: var(--neon-g);
  border-bottom-color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g), 0 0 16px var(--neon-g2);
}

/* ═══════════ PAGE LAYOUT ═══════════ */
.view { display: none; position: relative; z-index: 1; }
.view.active { display: block; animation: crtIn .2s ease; }
@keyframes crtIn {
  from { opacity: 0; transform: scaleY(0.97); filter: brightness(2); }
  to   { opacity: 1; transform: scaleY(1);    filter: brightness(1); }
}

.page { max-width: 900px; margin: 0 auto; padding: 24px 16px 32px; }

/* ═══════════ FILTER ROW ═══════════ */
.filter-row {
  display: flex; gap: 6px; margin-bottom: 20px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.filter-row::-webkit-scrollbar { display: none; }

.fcoin {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  padding: 6px 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--dim); cursor: pointer; white-space: nowrap;
  transition: all 0.12s;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
}
.fcoin.active {
  background: var(--neon-g);
  border-color: var(--neon-g);
  color: var(--void);
  box-shadow: 0 0 14px rgba(57,255,20,0.4), 2px 2px 0 var(--neon-g2);
}
.fcoin:hover:not(.active) { border-color: var(--rail2); color: var(--text2); }

/* ═══════════ STAT BOARD (top 4 numbers) ═══════════ */
.scoreboard-strip {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin-bottom: 22px;
}
@media(max-width:480px){ .scoreboard-strip { grid-template-columns: repeat(2,1fr); } }

.score-box {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  padding: 14px 10px 12px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 2px 2px 0 rgba(0,0,0,0.6);
}

/* pixel corner accents */
.score-box::before,
.score-box::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  border-color: var(--neon-g2);
  border-style: solid;
}
.score-box::before { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
.score-box::after  { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

.score-box.b-p::before, .score-box.b-p::after { border-color: var(--neon-p2); }
.score-box.b-y::before, .score-box.b-y::after { border-color: var(--neon-y2); }
.score-box.b-c::before, .score-box.b-c::after { border-color: var(--neon-c2); }

.sb-num {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 32px;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2);
}
.score-box.b-p .sb-num { color: var(--neon-p); text-shadow: 0 0 10px var(--neon-p), 0 0 20px var(--neon-p2); }
.score-box.b-y .sb-num { color: var(--neon-y); text-shadow: 0 0 10px var(--neon-y); }
.score-box.b-c .sb-num { color: var(--neon-c); text-shadow: 0 0 10px var(--neon-c); }

.sb-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-top: 6px;
  text-transform: uppercase;
  line-height: 1.4;
}

/* ═══════════ SECTION HEADER ═══════════ */
.sec-head {
  display: flex; align-items: center; gap: 10px;
  margin: 28px 0 14px;
}
.sec-head:first-child { margin-top: 0; }

.sec-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--neon-g);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 0 8px var(--neon-g2);
  white-space: nowrap;
}

.sec-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--rail2), transparent);
}

/* ═══════════ PLAYER ROWS ═══════════ */
.player-list {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}

.pl-header {
  display: grid;
  grid-template-columns: 32px 1fr 56px 56px 52px 52px 80px;
  padding: 10px 14px;
  background: var(--panel2);
  border-bottom: 2px solid var(--rail2);
  gap: 6px;
}
.pl-hcell {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim);
  text-align: right;
}
.pl-hcell:nth-child(2) { text-align: left; }

@media(max-width:600px){
  .pl-header { grid-template-columns: 28px 1fr 52px 80px; }
  .ph-hide { display: none; }
}

.pl-row {
  display: grid;
  grid-template-columns: 32px 1fr 56px 56px 52px 52px 80px;
  padding: 12px 14px; gap: 6px;
  border-bottom: 2px solid var(--rail);
  align-items: center;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}
.pl-row:last-child { border-bottom: none; }
.pl-row:hover { background: rgba(57,255,20,0.04); }

@media(max-width:600px){ .pl-row { grid-template-columns: 28px 1fr 52px 80px; } }

/* rank number with arcade styling */
.pl-rank {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  text-align: center;
  color: var(--dim);
}
.pl-rank.r1 { color: var(--neon-y); text-shadow: 0 0 8px var(--neon-y); }
.pl-rank.r2 { color: #aaa; text-shadow: 0 0 6px #888; }
.pl-rank.r3 { color: var(--neon-o); text-shadow: 0 0 6px var(--neon-o); }

.pl-bowler { display: flex; align-items: center; gap: 10px; }

/* pixel avatar */
.px-av {
  width: 38px; height: 38px;
  border-radius: var(--radius-px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  flex-shrink: 0;
  border: 2px solid;
  position: relative;
}

.pl-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1;
}
.pl-sub {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
}

.pl-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px; font-weight: 700;
  text-align: right; color: var(--text);
}
.pl-num.hi {
  color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g);
}

/* spark bars */
.spark-bars {
  display: flex; align-items: flex-end; gap: 2px;
  height: 28px; justify-content: flex-end;
}
.spk {
  width: 5px; border-radius: 2px 2px 0 0;
  background: var(--rail);
}
.spk.pos { background: var(--neon-g2); }
.spk.top {
  background: var(--neon-g);
  box-shadow: 0 0 6px var(--neon-g), 0 -2px 8px var(--neon-g2);
}

/* ═══════════ EXPANDABLE BOWLER CARDS ═══════════ */
.bc-card {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  margin-bottom: 8px;
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(0,0,0,.5);
  transition: border-color .2s;
}
.bc-card:hover { border-color: var(--rail2); }
.bc-card.bc-open { border-color: var(--neon-g); }

.bc-summary {
  display: flex; align-items: center;
  padding: 12px 14px; gap: 12px;
  cursor: pointer;
}
.bc-summary:hover { background: rgba(57,255,20,.03); }

.bc-rank {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px; text-align: center; width: 24px; flex-shrink: 0;
  color: var(--dim);
}
.bc-rank.r1 { color: var(--neon-y); text-shadow: 0 0 8px var(--neon-y); }
.bc-rank.r2 { color: #aaa; }
.bc-rank.r3 { color: var(--neon-o); }

.bc-info { flex: 1; min-width: 0; }
.bc-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700; color: var(--text);
}
.bc-sub {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px; color: var(--dim); margin-top: 2px;
}

.bc-right {
  display: flex; align-items: center; gap: 14px; flex-shrink: 0;
}
.bc-avg {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px; font-weight: 900; text-align: right; line-height: 1;
}
.bc-avg-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--dim); letter-spacing: 1px;
  text-align: right; margin-top: 2px;
}
.bc-chev { color: var(--dim); font-size: 11px; transition: transform .2s; }
.bc-card.bc-open .bc-chev { transform: rotate(180deg); }

/* Detail body */
.bc-body {
  display: none;
  border-top: 2px solid var(--rail);
  padding: 14px;
}
.bc-card.bc-open .bc-body { display: block; }

/* 2-col mini stat grid */
.bc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}
.bc-stat {
  background: var(--panel2);
  border: 1px solid var(--rail);
  border-radius: var(--radius-px);
  padding: 10px 12px;
}
.bc-stat-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; letter-spacing: 1px;
  color: var(--dim); margin-bottom: 5px; line-height: 1.5;
}
.bc-stat-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px; font-weight: 700;
  color: var(--text); line-height: 1;
}
.bc-stat-val .bc-unit {
  font-size: 12px; font-weight: 400; color: var(--dim);
}
.bc-trend-up { font-family:'Exo 2',sans-serif; font-size:11px; color:var(--neon-g); margin-top:3px; }
.bc-trend-dn { font-family:'Exo 2',sans-serif; font-size:11px; color:var(--neon-r); margin-top:3px; }
.bc-trend-eq { font-family:'Exo 2',sans-serif; font-size:11px; color:var(--dim); margin-top:3px; }

/* Opportunity badge */
.bc-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(0,255,255,.08);
  border: 1px solid rgba(0,255,255,.3);
  border-radius: var(--radius-px);
  padding: 5px 10px; margin-bottom: 12px;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--neon-c);
  letter-spacing: 1px; line-height: 1.5;
}

/* Section divider inside card */
.bc-section {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--neon-g);
  letter-spacing: 2px; text-transform: uppercase;
  text-shadow: 0 0 6px var(--neon-g2);
  padding-bottom: 7px;
  border-bottom: 1px solid var(--rail2);
  margin-bottom: 10px; margin-top: 14px;
}
.bc-section:first-child { margin-top: 0; }

/* Trend bar */
.bc-bar-row { margin-bottom: 7px; }
.bc-bar-labels {
  display: flex; justify-content: space-between;
  font-family: 'Exo 2', sans-serif;
  font-size: 11px; color: var(--dim); margin-bottom: 3px;
}
.bc-bar-track {
  height: 7px; background: var(--panel2);
  border-radius: 3px; overflow: hidden;
}
.bc-bar-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }

/* Potential avg callout */
.bc-potential {
  background: rgba(57,255,20,.06);
  border: 1px solid rgba(57,255,20,.25);
  border-radius: var(--radius-px);
  padding: 10px 12px; margin-top: 10px;
  display: flex; align-items: center; gap: 10px;
}
.bc-potential-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px; font-weight: 900;

.lb-dot {
  width: 8px; height: 8px;

}

.lb-nm { flex: 1; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 600; }

.lb-score {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px; font-weight: 700;
}

/* ═══════════ WEEKLY ═══════════ */
.wk-panel {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);

  margin-bottom: 10px;

}

.wk-top {

.wk-week-label {

}
.wk-meta {

.wk-avg-lbl {

.wk-body {

.wk-prow {

.wk-pname {

.wk-pgames {

.footer-bar::before { left: 0; background: linear-gradient(90deg, var(--void), transparent); }

@keyframes marquee2 { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.ms-badge.rare      { border-color:var(--neon-c); color:var(--neon-c); background:rgba(0,255,255,.05); }
.ms-badge.uncommon  { border-color:var(--neon-g); color:var(--neon-g); background:rgba(57,255,20,.05); }

/* 300 perfect game animation */
@keyframes perfect300 {
  0%   { transform:scale(1);    filter:brightness(1); }
  25%  { transform:scale(1.15); filter:brightness(1.8) hue-rotate(20deg); }
  50%  { transform:scale(1);    filter:brightness(1); }
  75%  { transform:scale(1.1);  filter:brightness(1.5) hue-rotate(-20deg); }
  100% { transform:scale(1);    filter:brightness(1); }
}
@keyframes rainbow {
  0%   { color:var(--neon-y); text-shadow:0 0 20px var(--neon-y); }
  25%  { color:var(--neon-g); text-shadow:0 0 20px var(--neon-g); }

  100% { color:var(--neon-y); text-shadow:0 0 20px var(--neon-y); }
}
@keyframes confetti-fall {
  0%   { transform:translateY(-20px) rotate(0deg);   opacity:1; }
  100% { transform:translateY(60px)  rotate(720deg); opacity:0; }
}
.perfect-300 { animation: rainbow 1.5s linear infinite; }
.perfect-300-badge {
  animation: perfect300 2s ease-in-out infinite;
  display: inline-block;
}
.confetti-dot {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  animation: confetti-fall 1.2s ease-in infinite;
  pointer-events: none;

/* Award grid */

<script>
/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
const COLORS = ['#ffb830','#39ff14','#ff3d6b','#00ffff','#b87eff','#ff6600','#00e5ff','#ff00ff'];
function pColor(name){
  if(!name) return '#39ff14';
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))&0xffffffff;
  return COLORS[Math.abs(h)%COLORS.length];
}
function ini2(n){ return (n||'??').slice(0,2).toUpperCase(); }

function goTab(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

function emptyState(msg){
  return `<div style="text-align:center;padding:48px 20px;">
    <div style="font-size:36px;margin-bottom:14px;">🎳</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--dim);letter-spacing:1px;line-height:1.8;">${msg}</div>
    <div style="margin-top:18px;">
      <button onclick="window.location.href='upload.html'"
        style="background:var(--neon-g);color:var(--void);border:none;border-radius:4px;padding:10px 22px;
               font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:1px;cursor:pointer;
               box-shadow:0 0 16px rgba(57,255,20,.3),3px 3px 0 var(--neon-g2);">
        📸 UPLOAD FIRST SCORE
      </button>
    </div>
  </div>`;
}

function loadingState(){
  return `<div style="text-align:center;padding:40px 20px;">
    <div style="width:40px;height:40px;border:3px solid var(--rail2);border-top-color:var(--neon-g);
                border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;
                box-shadow:0 0 16px rgba(57,255,20,.2);"></div>
    <div style="font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);letter-spacing:1px;">LOADING...</div>
  </div>`;
}

/* ════════════════════════════════════════
   API
════════════════════════════════════════ */
const SCRIPT_URL = (window.LANE_CONFIG && LANE_CONFIG.SCRIPT_URL && !LANE_CONFIG.SCRIPT_URL.includes('PASTE_YOUR'))
  ? LANE_CONFIG.SCRIPT_URL
  : 'https://script.google.com/macros/s/AKfycbyC94fiIbIMsXxUKT-hD1Wxcq8nj2apLHeYugxPdcYelvQ3WlwZMmMbOfkN_N_eOE1yJQ/exec';

async function apiFetch(action){
  const r = await fetch(`${SCRIPT_URL}?action=${action}`);
  if(!r.ok) throw new Error('API error '+r.status);
  return r.json();
}

/* ════════════════════════════════════════
   MARQUEE — static defaults, updated after load
════════════════════════════════════════ */
function buildMarquee(items){
  const doubled = [...items,...items];
  return doubled.map(t=>`<span class="marquee-item">${t}</span>`).join('');
}

/* ════════════════════════════════════════
   LOAD ALL DATA ON PAGE LOAD
════════════════════════════════════════ */
let liveStats = null;
let liveHistory = null;
let liveWeekly = null;
let liveAwards = null;

async function loadAll(){
  try {
    const [stats, history, weekly, awards] = await Promise.all([
      apiFetch('stats'),
      apiFetch('history'),
      apiFetch('weekly'),
      apiFetch('awards'),
    ]);
    liveStats   = stats;
    liveHistory = history;
    liveWeekly  = weekly;
    liveAwards  = awards;

    renderStats(stats);
    renderLeaders(stats);
    renderWeekly(weekly);
    renderHistory(history);
    renderAwards(awards, stats);
    updateHeaderAndMarquee(stats);
  } catch(e) {
    console.error('Failed to load data:', e);
    document.getElementById('bowlerCards').innerHTML =
      `<div style="padding:20px;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--neon-r);text-align:center;">
        Could not connect to server.<br>Check your SCRIPT_URL in config.js.
      </div>`;
  }
}

/* ════════════════════════════════════════
   UPDATE HEADER READOUTS + MARQUEE
════════════════════════════════════════ */
function updateHeaderAndMarquee(stats){
  const bowlers = stats.bowlers || [];
  if(!bowlers.length) return;

  const allGames = bowlers.flatMap(b => b.recentGames || []);
  const groupAvg = allGames.length ? Math.round(allGames.reduce((a,b)=>a+b,0)/allGames.length) : 0;
  const highGame = Math.max(...bowlers.map(b=>b.highGame||0));

  document.getElementById('hdr-avg').textContent  = groupAvg || '—';
  document.getElementById('hdr-high').textContent = highGame || '—';
  document.getElementById('stat-avg').textContent  = groupAvg || '—';
  document.getElementById('stat-high').textContent = highGame || '—';
  document.getElementById('stat-sessions').textContent = liveHistory?.sessions?.length || '—';
  document.getElementById('stat-games').textContent    = bowlers.reduce((s,b)=>s+b.gamesCount,0) || '—';

  // Build live marquee from real data + config
  const leader = [...bowlers].sort((a,z)=>z.avg-a.avg)[0];
  const highSeries = Math.max(...bowlers.map(b=>b.highSeries||0));
  const items = [
    `${_siteName} · SEASON STATS`,
    leader ? `${leader.name.toUpperCase()} LEADS · ${leader.avg} AVG` : null,
    highGame ? `HIGH GAME THIS SEASON: ${highGame}` : null,
    `${bowlers.length} PLAYERS TRACKED`,
    highSeries ? `BEST SERIES: ${highSeries}` : null,
    `UPLOAD SCORES AFTER EACH SESSION`,
    `${_leagueName} · EVERY ${_leagueDay}`,
  ].filter(Boolean);

  document.getElementById('topMarquee').innerHTML = buildMarquee(items);
}

/* ════════════════════════════════════════
   STATS TAB — expandable bowler cards
════════════════════════════════════════ */
function renderStats(stats){
  const bowlers = stats.bowlers || [];
  const el = document.getElementById('bowlerCards');
  if(!el) return;

  if(!bowlers.length){
    el.innerHTML = emptyState('NO GAMES YET<br>UPLOAD YOUR FIRST SCORE SCREEN');
    return;
  }

  const sorted = [...bowlers].sort((a,z)=>z.avg-a.avg);
  const rankClass = ['r1','r2','r3','','','','','',''];

  el.innerHTML = sorted.map((p,i) => bowlerCard(p, i, rankClass[i]||'')).join('');
}

function bowlerCard(p, i, rankCls) {
  const c   = pColor(p.name);
  const ini = ini2(p.name);

  // ── Core stats ──
  const sparePct      = p.sparePct !== null && p.sparePct !== undefined ? p.sparePct : null;
  const strikePct     = p.strikePct !== null && p.strikePct !== undefined ? p.strikePct : null;
  const splitPct      = p.splitPct !== null && p.splitPct !== undefined ? p.splitPct : null;
  const strikeRate    = p.gamesCount > 0 && p.strikes > 0
    ? (p.strikes / p.gamesCount).toFixed(1) : null;
  const missedPerGame = p.gamesCount > 0 && p.missedSpares > 0
    ? (p.missedSpares / p.gamesCount).toFixed(1) : null;

  // ── Potential avg — use server calculated if available ────────
  const potentialAvg = p.potentialAvg || null;

  // ── Biggest opportunity insight ──
  const opp = (() => {
    if (sparePct !== null && sparePct < 50 && (p.missedSpares || 0) > 0)
      return `SPARE CONVERSION AT ${sparePct}% — BIGGEST GAIN AREA`;
    if (strikePct !== null && strikePct < 20)
      return 'STRIKE RATE — FOCUS ON FIRST BALL';
    if (splitPct !== null && p.splits > 2 && splitPct < 30)
      return `SPLIT CONVERSION AT ${splitPct}% — TOUGH LEAVES`;
    return null;
  })();

  // ── Score trend bars ──
  const trend = p.recentGames || [];
  const mx = trend.length ? Math.max(...trend) : 200;
  const mn = trend.length ? Math.min(...trend) : 100;
  const sparkBars = trend.slice(-7).map(v => {
    const h = Math.max(4, Math.round(5 + ((v-mn) / Math.max(mx-mn,1)) * 22));
    const cls = v===mx ? 'top' : v>(p.avg||0) ? 'pos' : '';
    return `<div class="spk ${cls}" style="height:${h}px"></div>`;
  }).join('');

  // ── Spare conv color ──
  const spareColor = sparePct === null ? 'var(--text)'
    : sparePct >= 70 ? 'var(--neon-g)'
    : sparePct >= 50 ? 'var(--neon-y)'
    : 'var(--neon-r)';

  return `
  <div class="bc-card" id="bcard_${i}">
    <div class="bc-summary" onclick="toggleCard(${i})">
      <div class="bc-rank ${rankCls}">${i+1}</div>
      <div class="px-av" style="background:${c}12;border-color:${c};color:${c};">${ini}</div>
      <div class="bc-info">
        <div class="bc-name" style="color:${c};text-shadow:0 0 8px ${c}55;">
          ${(liveAwards?.milestones||{})[p.name]?.['300'] ? '<span class="perfect-300" style="font-size:12px;">🏆</span> ' : ''}
          ${p.name.toUpperCase()}
          ${(() => {
            // Show highest milestone emoji inline
            const counts = (liveAwards?.milestones||{})[p.name] || {};
            const top = MILESTONES.find(m => (counts[m.key]||0) > 0);
            return top ? `<span style="font-size:12px;margin-left:4px;">${top.emoji}</span>` : '';
          })()}
        </div>
        <div class="bc-sub">${p.gamesCount||0} games · ${p.highGame||'—'} best</div>
      </div>
      <div class="bc-right">
        <div>
          <div class="bc-avg" style="color:${c};text-shadow:0 0 10px ${c}66;">${p.avg||'—'}</div>
          <div class="bc-avg-lbl">AVG</div>
        </div>
        <div class="spark-bars" style="height:28px;">${sparkBars||'<span style="color:var(--dim);font-size:10px;">—</span>'}</div>
        <div class="bc-chev">▾</div>
      </div>
    </div>

    <div class="bc-body">

      ${opp ? `<div class="bc-badge">▶ ${opp}</div>` : ''}

      ${(() => {
        // Show milestone badges if any
        const counts = (liveAwards?.milestones||{})[p.name] || {};
        const badges = MILESTONES.filter(m => (counts[m.key]||0) > 0);
        if (!badges.length) return '';
        return `<div class="ms-badges" style="margin-bottom:12px;">
          ${badges.map(m => `
            <div class="ms-badge ${m.rarity}">
              ${m.emoji} ${m.label}${(counts[m.key]||0)>1?' ×'+counts[m.key]:''}
            </div>`).join('')}
        </div>`;
      })()}

      <div class="bc-section">▶ PERFORMANCE</div>
      <div class="bc-grid">
        <div class="bc-stat">
          <div class="bc-stat-lbl">SPARE<br>CONV %</div>
          <div class="bc-stat-val" style="color:${spareColor};">
            ${sparePct !== null ? sparePct + '<span class="bc-unit">%</span>' : '—'}
          </div>
          ${sparePct !== null ? `<div class="${sparePct>=60?'bc-trend-up':sparePct>=40?'bc-trend-eq':'bc-trend-dn'}">${sparePct>=70?'✓ SOLID':sparePct>=50?'ROOM TO GROW':'KEY FOCUS'}</div>` : ''}
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">STRIKE<br>RATE %</div>
          <div class="bc-stat-val">
            ${strikePct !== null ? strikePct + '<span class="bc-unit">%</span>' : strikeRate !== null ? strikeRate + '<span class="bc-unit">/gm</span>' : '—'}
          </div>
          ${p.strikes ? `<div class="bc-trend-eq">${p.strikes} TOTAL</div>` : ''}
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">MISSED<br>SPARES</div>
          <div class="bc-stat-val" style="${(p.missedSpares||0)>0?'color:var(--neon-r);':''}">
            ${missedPerGame !== null ? missedPerGame + '<span class="bc-unit">/gm</span>' : '—'}
          </div>
          ${p.missedSpares ? `<div class="bc-trend-dn">${p.missedSpares} TOTAL</div>` : '<div class="bc-trend-eq">NO DATA YET</div>'}
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">SPLIT<br>CONV %</div>
          <div class="bc-stat-val" style="${splitPct !== null && splitPct >= 30 ? 'color:var(--neon-g);' : splitPct !== null ? 'color:var(--neon-y);' : ''}">
            ${splitPct !== null ? splitPct + '<span class="bc-unit">%</span>' : '—'}
          </div>
          ${p.splits ? `<div class="bc-trend-eq">${p.splitsConverted||0}/${p.splits} SPLITS</div>` : '<div class="bc-trend-eq">NO DATA YET</div>'}
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">BALL<br>SPEED</div>
          <div class="bc-stat-val">
            ${p.avgSpeed ? p.avgSpeed + '<span class="bc-unit"> mph</span>' : '—'}
          </div>
        </div>
      </div>

      <div class="bc-section">▶ SCORES</div>
      <div class="bc-grid">
        <div class="bc-stat">
          <div class="bc-stat-lbl">HIGH<br>GAME</div>
          <div class="bc-stat-val" style="color:var(--neon-y);">${p.highGame||'—'}</div>
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">HIGH<br>SERIES</div>
          <div class="bc-stat-val" style="color:var(--neon-y);">${p.highSeries||'—'}</div>
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">TOP 3<br>AVG</div>
          <div class="bc-stat-val">${p.top3Avg||'—'}</div>
        </div>
        <div class="bc-stat">
          <div class="bc-stat-lbl">FIRST 3<br>AVG</div>
          <div class="bc-stat-val">${p.first3Avg||'—'}</div>
        </div>
      </div>

      ${sparePct !== null ? `
      <div class="bc-section">▶ SPARE CONVERSION</div>
      <div class="bc-bar-row">
        <div class="bc-bar-labels"><span>CURRENT</span><span style="color:${spareColor};">${sparePct}%</span></div>
        <div class="bc-bar-track"><div class="bc-bar-fill" style="width:${sparePct}%;background:${spareColor};"></div></div>
      </div>
      <div class="bc-bar-row">
        <div class="bc-bar-labels"><span>TARGET</span><span style="color:var(--neon-g);">70%</span></div>
        <div class="bc-bar-track"><div class="bc-bar-fill" style="width:70%;background:rgba(57,255,20,.3);border-right:2px solid var(--neon-g);"></div></div>
      </div>
      <div class="bc-bar-row">
        <div class="bc-bar-labels"><span>ELITE</span><span style="color:var(--dim);">90%</span></div>
        <div class="bc-bar-track"><div class="bc-bar-fill" style="width:90%;background:var(--rail2);"></div></div>
      </div>
      ` : ''}

      ${potentialAvg ? `
      <div class="bc-potential">
        <div class="bc-potential-val">${potentialAvg}</div>
        <div class="bc-potential-txt">
          Projected avg if spare<br>conversion reaches <strong style="color:var(--neon-g);">70%</strong><br>
          <span style="color:var(--neon-g);">+${potentialAvg - p.avg} pins per game</span>
        </div>
      </div>
      ` : ''}

    </div>
  </div>`;
}

function toggleCard(i) {
  const card = document.getElementById('bcard_' + i);
  if (!card) return;
  card.classList.toggle('bc-open');
}

const MILESTONES = [
  { min:300, max:300, key:'300', label:'PERFECT 300',  emoji:'🏆', rarity:'legendary' },
  { min:290, max:299, key:'290', label:'290+ GAME',    emoji:'💎', rarity:'epic'      },
  { min:275, max:289, key:'275', label:'275+ GAME',    emoji:'🔥', rarity:'epic'      },
  { min:250, max:274, key:'250', label:'250+ GAME',    emoji:'⚡', rarity:'rare'      },
  { min:225, max:249, key:'225', label:'225+ GAME',    emoji:'🌟', rarity:'rare'      },
  { min:200, max:224, key:'200', label:'200+ GAME',    emoji:'✨', rarity:'uncommon'  },
  { min:175, max:199, key:'175', label:'175+ GAME',    emoji:'🎳', rarity:'common'    },
];

function renderAwards(awards, stats){
  const el = document.getElementById('awardsContent');
  if (!el) return;
  if (!awards || (!awards.currentWeek && !(awards.milestones && Object.keys(awards.milestones).length))) {
    el.innerHTML = emptyState('NO AWARD DATA YET<br>UPLOAD SCORES TO START EARNING AWARDS');
    return;
  }

  const w   = awards.weekly  || {};
  const ms  = awards.milestones || {};
  const all = stats?.bowlers || [];
  let html  = '';

  // ── WEEKLY AWARDS ────────────────────────────────────────────────
  if (awards.currentWeek) {
    html += `<div class="award-week-label">▶ THIS WEEK · ${awards.currentWeek}</div>`;

    // Royal Split Award
    const splitWinner = (w.splits||[])[0];
    if (splitWinner) {
      const runners = (w.splits||[]).slice(1,3).map(b=>`${b.name} (${b.splits})`).join(' · ');
      html += `<div class="award-banner cyan">
        <span class="award-emoji">👑</span>
        <div class="award-title">ROYAL SPLIT AWARD</div>
        <div class="award-winner" style="color:var(--neon-c);text-shadow:0 0 12px var(--neon-c);">
          👑 ${splitWinner.name.toUpperCase()}
        </div>
        <div class="award-stat">${splitWinner.splits} split${splitWinner.splits!==1?'s':''} this week — the most daring bowler on the lanes</div>
        ${runners ? `<div class="award-runners">Also: ${runners}</div>` : ''}
      </div>`;
    }

    // Best Spare Shooter
    const spareWinner = (w.spare||[])[0];
    if (spareWinner && spareWinner.pct > 0) {
      const runners = (w.spare||[]).slice(1,3).map(b=>`${b.name} (${b.pct}%)`).join(' · ');
      html += `<div class="award-banner green">
        <span class="award-emoji">🎯</span>
        <div class="award-title">BEST SPARE SHOOTER</div>
        <div class="award-winner" style="color:var(--neon-g);text-shadow:0 0 12px var(--neon-g);">
          ${spareWinner.name.toUpperCase()}
        </div>
        <div class="award-stat">${spareWinner.pct}% conversion this week · ${spareWinner.spares} spares made</div>
        ${runners ? `<div class="award-runners">Also: ${runners}</div>` : ''}
      </div>`;
    }

    // Most Over Average
    const overWinner = (w.overAvg||[])[0];
    if (overWinner) {
      const runners = (w.overAvg||[]).slice(1,3).map(b=>`${b.name} (+${b.overAvg})`).join(' · ');
      html += `<div class="award-banner gold">
        <span class="award-emoji">🚀</span>
        <div class="award-title">MOST OVER AVERAGE</div>
        <div class="award-winner" style="color:var(--neon-y);text-shadow:0 0 12px var(--neon-y);">
          ${overWinner.name.toUpperCase()}
        </div>
        <div class="award-stat">+${overWinner.overAvg} pins over their prior average · Bowled ${overWinner.weekAvg} vs ${overWinner.priorAvg} prior avg</div>
        ${runners ? `<div class="award-runners">Also: ${runners}</div>` : ''}
      </div>`;
    }

    // High Game of the Week
    if (w.highGame) {
      const is300 = w.highGame.score === 300;
      html += `<div class="award-banner ${is300?'legendary':'pink'}">
        <span class="award-emoji">${is300?'🏆':'⭐'}</span>
        <div class="award-title">${is300?'PERFECT GAME!!!':'HIGH GAME OF THE WEEK'}</div>
        <div class="award-winner ${is300?'perfect-300':''}" style="color:${is300?'var(--neon-y)':'var(--neon-p)'};text-shadow:0 0 12px ${is300?'var(--neon-y)':'var(--neon-p)'};">
          ${w.highGame.name.toUpperCase()} · ${w.highGame.score}
        </div>
        ${is300 ? '<div class="award-stat" style="color:var(--neon-y);">🎳 A PERFECT GAME — EVERY FRAME A STRIKE — LEGENDARY! 🎳</div>' : ''}
      </div>`;
    }
  }

  // ── GAME MILESTONE BADGES (Season) ───────────────────────────────
  const hasMilestones = Object.keys(ms).length > 0;
  if (hasMilestones) {
    html += `<div style="margin-top:24px;">
      <div class="award-week-label">▶ SEASON MILESTONE GAMES</div>`;

    // Check for any 300 games — give them a special spotlight
    const perfect300Bowlers = Object.entries(ms)
      .filter(([name, counts]) => (counts['300']||0) > 0);
    if (perfect300Bowlers.length) {
      perfect300Bowlers.forEach(([name, counts]) => {
        html += `<div class="award-banner legendary" style="text-align:center;padding:24px;">
          <div style="font-size:48px;margin-bottom:10px;" class="perfect-300-badge">🏆</div>
          <div class="award-title" style="text-align:center;font-size:12px;">PERFECT GAME</div>
          <div class="award-winner perfect-300" style="text-align:center;font-size:28px;margin-top:8px;">
            ${name.toUpperCase()}
          </div>
          <div class="award-stat" style="text-align:center;margin-top:6px;color:var(--neon-y);">
            ${counts['300'] > 1 ? counts['300'] + 'x ' : ''}300 — THE PINNACLE OF BOWLING
          </div>
        </div>`;
      });
    }

    // All other milestone achievements per bowler
    const bowlerOrder = all.map(b => b.name).filter(n => ms[n]);
    const shown = new Set();
    bowlerOrder.forEach(name => {
      if (shown.has(name)) return; shown.add(name);
      const counts = ms[name];
      const badges = MILESTONES.filter(m => (counts[m.key]||0) > 0 && m.key !== '300');
      if (!badges.length) return;
      const c = pColor(name);
      html += `<div class="bc-card" style="margin-bottom:8px;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;">
          <div class="px-av" style="background:${c}15;border-color:${c};color:${c};">${ini2(name)}</div>
          <div style="flex:1;">
            <div class="bc-name" style="color:${c};text-shadow:0 0 8px ${c}55;">${name.toUpperCase()}</div>
            <div class="ms-badges">
              ${badges.map(m => `
                <div class="ms-badge ${m.rarity}">
                  ${m.emoji} ${m.label}${(counts[m.key]||0)>1?' ×'+counts[m.key]:''}
                </div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  // ── SEASON LEADERS ───────────────────────────────────────────────
  if ((awards.season?.spare||[]).length || (awards.season?.splits||[]).length) {
    html += `<div style="margin-top:24px;">
      <div class="award-week-label">▶ SEASON LEADERS</div>`;

    const ssWinner = (awards.season?.spare||[])[0];
    if (ssWinner) {
      const runners = (awards.season?.spare||[]).slice(1,4).map(b=>`${b.name} (${b.pct}%)`).join(' · ');
      html += `<div class="award-banner green">
        <span class="award-emoji">🎯</span>
        <div class="award-title">SEASON SPARE LEADER</div>
        <div class="award-winner" style="color:var(--neon-g);">${ssWinner.name.toUpperCase()}</div>
        <div class="award-stat">${ssWinner.pct}% season spare conversion</div>
        ${runners ? `<div class="award-runners">${runners}</div>` : ''}
      </div>`;
    }

    const ssSplit = (awards.season?.splits||[])[0];
    if (ssSplit) {
      html += `<div class="award-banner cyan">
        <span class="award-emoji">👑</span>
        <div class="award-title">ROYAL SPLIT — SEASON</div>
        <div class="award-winner" style="color:var(--neon-c);">👑 ${ssSplit.name.toUpperCase()}</div>
        <div class="award-stat">${ssSplit.splits} splits faced this season</div>
      </div>`;
    }
    html += `</div>`;
  }

  el.innerHTML = html || emptyState('NO AWARD DATA YET<br>UPLOAD SCORES TO START EARNING AWARDS');
}

function renderLeaders(stats){
  const bowlers = stats.bowlers || [];
  const el = document.getElementById('lbGrid');

  if(!bowlers.length){
    el.innerHTML = emptyState('NO DATA YET<br>UPLOAD SCORES TO SEE LEADERBOARD');
    return;
  }

  const posCls = ['p1','p2','p3','','',''];
  const lbCats = [
    { icon:'🏆', title:'SEASON AVG',    rows:[...bowlers].sort((a,z)=>z.avg-a.avg).map(p=>({n:p.name,c:pColor(p.name),v:p.avg})) },
    { icon:'🎯', title:'HIGH GAME',     rows:[...bowlers].sort((a,z)=>z.highGame-a.highGame).map(p=>({n:p.name,c:pColor(p.name),v:p.highGame})) },
    { icon:'💥', title:'HIGH SERIES',   rows:[...bowlers].filter(b=>b.highSeries>0).sort((a,z)=>z.highSeries-a.highSeries).map(p=>({n:p.name,c:pColor(p.name),v:p.highSeries})) },
    { icon:'/',  title:'SPARE CONV %',  rows:[...bowlers].filter(b=>b.sparePct!==null&&b.sparePct!==undefined).sort((a,z)=>z.sparePct-a.sparePct).map(p=>({n:p.name,c:pColor(p.name),v:p.sparePct+'%'})) },
    { icon:'X',  title:'STRIKE %',      rows:[...bowlers].filter(b=>b.strikePct!==null&&b.strikePct!==undefined).sort((a,z)=>z.strikePct-a.strikePct).map(p=>({n:p.name,c:pColor(p.name),v:p.strikePct+'%'})) },
    { icon:'🎳', title:'SPLIT CONV %',  rows:[...bowlers].filter(b=>b.splitPct!==null&&b.splits>0).sort((a,z)=>z.splitPct-a.splitPct).map(p=>({n:p.name,c:pColor(p.name),v:p.splitPct+'%'})) },
  ];

  el.innerHTML = lbCats.map(cat=>`
    <div class="lb-cabinet">
      <div class="lb-cab-header">
        <span class="lb-cab-icon">${cat.icon}</span>
        <span class="lb-cab-title">${cat.title}</span>
      </div>
      ${cat.rows.slice(0,6).map((r,i)=>`
      <div class="lb-entry">
        <div class="lb-pos ${posCls[i]||''}">${['01','02','03','04','05','06'][i]}</div>
        <div class="lb-dot" style="background:${r.c};box-shadow:0 0 8px ${r.c};"></div>
        <div class="lb-nm" style="color:${r.c};text-shadow:0 0 6px ${r.c}44;">${r.n.toUpperCase()}</div>
        <div class="lb-score" style="color:${r.c};text-shadow:0 0 8px ${r.c}66;">${r.v}</div>
      </div>`).join('')}
    </div>`).join('');
}

/* ════════════════════════════════════════
   WEEKLY TAB
════════════════════════════════════════ */
function renderWeekly(weekly){
  const weeks = weekly.weeks || [];
  const el = document.getElementById('weeklyPanels');

  if(!weeks.length){
    el.innerHTML = emptyState('NO WEEKLY DATA YET<br>UPLOAD SCORES TO START TRACKING');
    return;
  }

  el.innerHTML = [...weeks].reverse().map((w,i)=>`
    <div class="wk-panel ${i===0?'wo':''}">
      <div class="wk-top" onclick="this.parentElement.classList.toggle('wo')">
        <div>
          <div class="wk-week-label">${w.week}</div>
          <div class="wk-meta">HIGH GAME: ${w.highGame}  //  ${w.bowlers.length} PLAYERS</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div>
            <div class="wk-avg-display">${w.groupAvg}</div>
            <div class="wk-avg-lbl">GRP AVG</div>
          </div>
          <span class="chv">▾</span>
        </div>
      </div>
      <div class="wk-body">
        ${w.bowlers.map(b=>`
        <div class="wk-prow">
          <div class="wk-pname" style="color:${pColor(b.name)};text-shadow:0 0 6px ${pColor(b.name)}55;">${b.name.toUpperCase()}</div>
          <div class="wk-pgames">${b.games.join('  ·  ')}</div>
          <div class="wk-pavg" style="${b.avg>=200?'color:var(--neon-g);text-shadow:0 0 8px var(--neon-g);':''}">${b.avg}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ════════════════════════════════════════
   HISTORY TAB
════════════════════════════════════════ */
function renderHistory(history){
  const sessions = history.sessions || [];
  const el = document.getElementById('histPanels');

  if(!sessions.length){
    el.innerHTML = emptyState('NO SESSIONS YET<br>UPLOAD YOUR FIRST SCORE SCREEN');
    return;
  }

  el.innerHTML = sessions.map((s,i)=>{
    const bowlers = s.bowlers || [];
    const pins = bowlers.reduce((sum,b)=>sum+(b.series||0),0);
    return `<div class="hs-panel ${i===0?'ho':''}">
      <div class="hs-top" onclick="this.parentElement.classList.toggle('ho')">
        <div>
          <div class="hs-date" style="color:${i===0?'var(--neon-g)':'var(--text)'};">${s.date}${s.teamName?'  //  '+s.teamName:''}</div>
          <div class="hs-meta">${bowlers.length} PLAYERS  ·  ${pins} TOTAL PINS</div>
        </div>
        <span class="chv">▾</span>
      </div>
      <div class="hs-body">
        ${bowlers.map(b=>`
        <div class="hs-prow">
          <div class="hs-nm" style="color:${pColor(b.matchedName||b.name)};text-shadow:0 0 6px ${pColor(b.matchedName||b.name)}44;">${(b.matchedName||b.name||'').toUpperCase()}</div>
          <div style="flex:1;">${(b.games||[]).map(g=>`<span class="score-tile ${g>=200?'lit':''}">${g}</span>`).join('')}</div>
          <div class="hs-ser">${b.series||''}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}
