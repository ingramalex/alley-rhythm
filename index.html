<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alley Rhythm — Retro Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;600;700;900&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ALLEY RHYTHM — RETRO ARCADE THEME
   CRT · Pixel borders · Neon glow · Cabinet DNA
═══════════════════════════════════════════ */
:root {
  --void:       #01030a;
  --deep:       #060914;
  --panel:      #0a0e1a;
  --panel2:     #0f1424;
  --groove:     #151c30;
  --rail:       #1e2840;
  --rail2:      #283450;

  /* Neons */
  --neon-g:     #39ff14;   /* classic arcade green */
  --neon-g2:    #22cc00;
  --neon-p:     #ff00ff;   /* magenta */
  --neon-p2:    #cc00cc;
  --neon-y:     #ffe600;   /* yellow */
  --neon-y2:    #ccb800;
  --neon-c:     #00ffff;   /* cyan */
  --neon-c2:    #00cccc;
  --neon-o:     #ff6600;   /* orange */

  --text:       #d0e8ff;
  --text2:      #8aa0c8;
  --dim:        #3a4a68;
  --radius-px:  4px;       /* pixel-sharp corners */
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--void);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── CRT OVERLAY ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 1000;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
  pointer-events: none;
  mix-blend-mode: multiply;
}

/* ── SCREEN VIGNETTE ── */
body::after {
  content: '';
  position: fixed; inset: 0; z-index: 999;
  background: radial-gradient(ellipse 85% 85% at 50% 50%, transparent 60%, rgba(0,0,0,0.7) 100%);
  pointer-events: none;
}

/* ── PIXEL BORDER UTILITY ── */
.px-border {
  border: 2px solid;
  image-rendering: pixelated;
}

/* ── NEON TEXT GLOW ── */
.glow-g  { text-shadow: 0 0 8px var(--neon-g), 0 0 20px var(--neon-g), 0 0 40px var(--neon-g2); }
.glow-p  { text-shadow: 0 0 8px var(--neon-p), 0 0 20px var(--neon-p), 0 0 40px var(--neon-p2); }
.glow-y  { text-shadow: 0 0 8px var(--neon-y), 0 0 20px var(--neon-y); }
.glow-c  { text-shadow: 0 0 8px var(--neon-c), 0 0 20px var(--neon-c); }

/* ═══════════ MARQUEE TICKER ═══════════ */
.marquee-wrap {
  background: var(--void);
  border-bottom: 2px solid var(--neon-y2);
  overflow: hidden;
  height: 28px;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 100;
}
.marquee-wrap::before,
.marquee-wrap::after {
  content: '';
  position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2;
}
.marquee-wrap::before { left: 0; background: linear-gradient(90deg, var(--void), transparent); }
.marquee-wrap::after  { right: 0; background: linear-gradient(-90deg, var(--void), transparent); }

.marquee-track {
  display: flex;
  gap: 0;
  animation: marquee 28s linear infinite;
  white-space: nowrap;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.marquee-item {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--neon-y);
  padding: 0 28px;
  letter-spacing: 1px;
}
.marquee-item::before { content: '★  '; }

/* ═══════════ HEADER ═══════════ */
.site-header {
  position: sticky; top: 0; z-index: 200;
  background: var(--deep);
  border-bottom: 3px solid var(--neon-g2);
  box-shadow: 0 0 30px rgba(57,255,20,0.15), 0 4px 0 var(--neon-g2);
}

.header-inner {
  max-width: 900px; margin: 0 auto;
  padding: 0 16px;
  display: flex; align-items: center;
  height: 66px; gap: 0;
}

/* LOGO */
.logo-wrap {
  display: flex; flex-direction: column;
  justify-content: center;
  padding-right: 20px;
  border-right: 2px solid var(--rail2);
  gap: 3px;
}

.logo-line1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 13px;
  letter-spacing: 1px;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2), 0 0 40px var(--neon-g2);
}

.logo-line2 {
  font-family: 'Orbitron', sans-serif;
  font-size: 8px;
  letter-spacing: 4px;
  color: var(--neon-p);
  text-shadow: 0 0 8px var(--neon-p), 0 0 16px var(--neon-p2);
  text-transform: uppercase;
}

/* LIVE SCORE READOUTS */
.header-readouts {
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  gap: 0;
  border-right: 2px solid var(--rail2);
}

.readout {
  padding: 6px 16px;
  text-align: center;
  border-right: 1px solid var(--rail);
  position: relative;
}
.readout:last-child { border-right: none; }

.readout-val {
  font-family: 'Orbitron', sans-serif;
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2);
}
.readout-val.hot { color: var(--neon-p); text-shadow: 0 0 10px var(--neon-p), 0 0 20px var(--neon-p2); }
.readout-val.warm { color: var(--neon-y); text-shadow: 0 0 10px var(--neon-y), 0 0 16px var(--neon-y2); }
.readout-val.ice { color: var(--neon-c); text-shadow: 0 0 10px var(--neon-c), 0 0 16px var(--neon-c2); }

.readout-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-top: 3px;
  text-transform: uppercase;
}

.header-spacer { flex: 1; }

.insert-btn {
  margin-right: 16px;
  background: var(--neon-g);
  color: var(--void);
  border: none;
  border-radius: var(--radius-px);
  padding: 10px 18px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.1s;
  box-shadow: 0 0 20px rgba(57,255,20,0.3), 3px 3px 0 var(--neon-g2);
  text-transform: uppercase;
  line-height: 1.4;
}
.insert-btn:hover {
  box-shadow: 0 0 30px rgba(57,255,20,0.6), 3px 3px 0 var(--neon-g2);
  transform: translate(-1px,-1px);
}
.insert-btn:active {
  transform: translate(2px,2px);
  box-shadow: 0 0 10px rgba(57,255,20,0.3), 1px 1px 0 var(--neon-g2);
}

/* ═══════════ NAV ═══════════ */
.nav-bar {
  background: var(--panel);
  border-bottom: 2px solid var(--rail2);
  display: flex;
  overflow-x: auto; scrollbar-width: none;
  position: relative;
}
.nav-bar::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--neon-g2) 0%, var(--neon-p2) 50%, var(--neon-c2) 100%);
  opacity: 0.4;
}
.nav-bar::-webkit-scrollbar { display: none; }

.nav-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; width: 100%; padding: 0 16px;
}

.ntab {
  padding: 12px 20px;
  background: none; border: none;
  border-bottom: 3px solid transparent;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim);
  cursor: pointer; white-space: nowrap;
  transition: all 0.15s;
  margin-bottom: -2px;
}
.ntab:hover { color: var(--text2); }
.ntab.active {
  color: var(--neon-g);
  border-bottom-color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g), 0 0 16px var(--neon-g2);
}

/* ═══════════ PAGE LAYOUT ═══════════ */
.view { display: none; position: relative; z-index: 1; }
.view.active { display: block; animation: crtIn .2s ease; }
@keyframes crtIn {
  from { opacity: 0; transform: scaleY(0.97); filter: brightness(2); }
  to   { opacity: 1; transform: scaleY(1);    filter: brightness(1); }
}

.page { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }

/* ═══════════ FILTER ROW ═══════════ */
.filter-row {
  display: flex; gap: 6px; margin-bottom: 20px;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.filter-row::-webkit-scrollbar { display: none; }

.fcoin {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  padding: 6px 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--dim); cursor: pointer; white-space: nowrap;
  transition: all 0.12s;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.5);
}
.fcoin.active {
  background: var(--neon-g);
  border-color: var(--neon-g);
  color: var(--void);
  box-shadow: 0 0 14px rgba(57,255,20,0.4), 2px 2px 0 var(--neon-g2);
}
.fcoin:hover:not(.active) { border-color: var(--rail2); color: var(--text2); }

/* ═══════════ STAT BOARD (top 4 numbers) ═══════════ */
.scoreboard-strip {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin-bottom: 22px;
}
@media(max-width:480px){ .scoreboard-strip { grid-template-columns: repeat(2,1fr); } }

.score-box {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  padding: 14px 10px 12px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 2px 2px 0 rgba(0,0,0,0.6);
}

/* pixel corner accents */
.score-box::before,
.score-box::after {
  content: '';
  position: absolute;
  width: 8px; height: 8px;
  border-color: var(--neon-g2);
  border-style: solid;
}
.score-box::before { top: 4px; left: 4px; border-width: 2px 0 0 2px; }
.score-box::after  { bottom: 4px; right: 4px; border-width: 0 2px 2px 0; }

.score-box.b-p::before, .score-box.b-p::after { border-color: var(--neon-p2); }
.score-box.b-y::before, .score-box.b-y::after { border-color: var(--neon-y2); }
.score-box.b-c::before, .score-box.b-c::after { border-color: var(--neon-c2); }

.sb-num {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: 32px;
  line-height: 1;
  color: var(--neon-g);
  text-shadow: 0 0 10px var(--neon-g), 0 0 20px var(--neon-g2);
}
.score-box.b-p .sb-num { color: var(--neon-p); text-shadow: 0 0 10px var(--neon-p), 0 0 20px var(--neon-p2); }
.score-box.b-y .sb-num { color: var(--neon-y); text-shadow: 0 0 10px var(--neon-y); }
.score-box.b-c .sb-num { color: var(--neon-c); text-shadow: 0 0 10px var(--neon-c); }

.sb-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-top: 6px;
  text-transform: uppercase;
  line-height: 1.4;
}

/* ═══════════ SECTION HEADER ═══════════ */
.sec-head {
  display: flex; align-items: center; gap: 10px;
  margin: 28px 0 14px;
}
.sec-head:first-child { margin-top: 0; }

.sec-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--neon-g);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-shadow: 0 0 8px var(--neon-g2);
  white-space: nowrap;
}

.sec-line {
  flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--rail2), transparent);
}

/* ═══════════ PLAYER ROWS ═══════════ */
.player-list {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}

.pl-header {
  display: grid;
  grid-template-columns: 32px 1fr 56px 56px 52px 52px 80px;
  padding: 10px 14px;
  background: var(--panel2);
  border-bottom: 2px solid var(--rail2);
  gap: 6px;
}
.pl-hcell {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--dim);
  text-align: right;
}
.pl-hcell:nth-child(2) { text-align: left; }

@media(max-width:600px){
  .pl-header { grid-template-columns: 28px 1fr 52px 80px; }
  .ph-hide { display: none; }
}

.pl-row {
  display: grid;
  grid-template-columns: 32px 1fr 56px 56px 52px 52px 80px;
  padding: 12px 14px; gap: 6px;
  border-bottom: 2px solid var(--rail);
  align-items: center;
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}
.pl-row:last-child { border-bottom: none; }
.pl-row:hover { background: rgba(57,255,20,0.04); }

@media(max-width:600px){ .pl-row { grid-template-columns: 28px 1fr 52px 80px; } }

/* rank number with arcade styling */
.pl-rank {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  text-align: center;
  color: var(--dim);
}
.pl-rank.r1 { color: var(--neon-y); text-shadow: 0 0 8px var(--neon-y); }
.pl-rank.r2 { color: #aaa; text-shadow: 0 0 6px #888; }
.pl-rank.r3 { color: var(--neon-o); text-shadow: 0 0 6px var(--neon-o); }

.pl-bowler { display: flex; align-items: center; gap: 10px; }

/* pixel avatar */
.px-av {
  width: 38px; height: 38px;
  border-radius: var(--radius-px);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  flex-shrink: 0;
  border: 2px solid;
  position: relative;
}

.pl-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1;
}
.pl-sub {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px;
  color: var(--dim);
  margin-top: 2px;
}

.pl-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px; font-weight: 700;
  text-align: right; color: var(--text);
}
.pl-num.hi {
  color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g);
}

/* spark bars */
.spark-bars {
  display: flex; align-items: flex-end; gap: 2px;
  height: 28px; justify-content: flex-end;
}
.spk {
  width: 5px; border-radius: 2px 2px 0 0;
  background: var(--rail);
}
.spk.pos { background: var(--neon-g2); }
.spk.top {
  background: var(--neon-g);
  box-shadow: 0 0 6px var(--neon-g), 0 -2px 8px var(--neon-g2);
}

/* ═══════════ LEADERBOARD ═══════════ */
.lb-arcade-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
@media(max-width:540px){ .lb-arcade-grid { grid-template-columns: 1fr; } }

.lb-cabinet {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  overflow: hidden;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}

.lb-cab-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--panel2);
  border-bottom: 2px solid var(--rail2);
}
.lb-cab-icon { font-size: 14px; }
.lb-cab-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--neon-g);
  text-shadow: 0 0 6px var(--neon-g2);
}

.lb-entry {
  display: flex; align-items: center;
  padding: 9px 14px; gap: 10px;
  border-bottom: 1px solid var(--rail);
  transition: background 0.1s;
}
.lb-entry:last-child { border-bottom: none; }
.lb-entry:hover { background: rgba(57,255,20,0.03); }

/* HIGH SCORE rank style */
.lb-pos {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px; width: 22px;
  text-align: center; flex-shrink: 0;
  color: var(--dim);
}
.lb-pos.p1 { color: var(--neon-y); text-shadow: 0 0 8px var(--neon-y); }
.lb-pos.p2 { color: #aaa; }
.lb-pos.p3 { color: var(--neon-o); }

.lb-dot {
  width: 8px; height: 8px;
  border-radius: 1px;
  flex-shrink: 0;
  box-shadow: 0 0 6px;
}

.lb-nm { flex: 1; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 600; }

.lb-score {
  font-family: 'Orbitron', sans-serif;
  font-size: 16px; font-weight: 700;
}

/* ═══════════ WEEKLY ═══════════ */
.wk-panel {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}

.wk-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer;
  transition: background 0.1s;
}
.wk-top:hover { background: rgba(57,255,20,0.03); }

.wk-week-label {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g2);
}
.wk-meta {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px; color: var(--dim); margin-top: 3px;
}

.wk-avg-display {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px; font-weight: 900;
  color: var(--neon-g);
  text-shadow: 0 0 12px var(--neon-g), 0 0 24px var(--neon-g2);
  text-align: right;
  line-height: 1;
}
.wk-avg-lbl {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; color: var(--dim);
  letter-spacing: 1px; text-align: right;
  margin-top: 4px;
}

.wk-body {
  display: none;
  border-top: 2px solid var(--rail);
  padding: 0;
}
.wk-panel.wo .wk-body { display: block; }
.wk-panel.wo .wk-top .chv { transform: rotate(180deg); }

.wk-prow {
  display: flex; align-items: center;
  padding: 9px 16px; gap: 12px;
  border-bottom: 1px solid var(--rail);
  font-size: 13px;
}
.wk-prow:last-child { border-bottom: none; }

.wk-pname {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px; font-weight: 700;
  flex: 1; min-width: 70px;
}
.wk-pgames {
  font-family: 'Exo 2', sans-serif;
  font-size: 12px; color: var(--text2);
  flex: 2; text-align: center;
}
.wk-pavg {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px; font-weight: 700;
  min-width: 42px; text-align: right;
}

/* ═══════════ HISTORY ═══════════ */
.hs-panel {
  background: var(--panel);
  border: 2px solid var(--rail);
  border-radius: var(--radius-px);
  overflow: hidden;
  margin-bottom: 10px;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
}

.hs-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px;
  transition: background 0.1s;
}
.hs-top:hover { background: rgba(57,255,20,0.03); }

.hs-date {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700;
}
.hs-meta {
  font-family: 'Exo 2', sans-serif;
  font-size: 11px; color: var(--dim); margin-top: 2px;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px; letter-spacing: 0.5px;
}

.hs-body {
  display: none;
  border-top: 2px solid var(--rail);
  padding: 10px 16px;
}
.hs-panel.ho .hs-body { display: block; }
.hs-panel.ho .chv { transform: rotate(180deg); }

.hs-prow {
  display: flex; align-items: center;
  gap: 10px; padding: 7px 0;
  border-bottom: 1px solid var(--rail);
}
.hs-prow:last-child { border-bottom: none; }

.hs-nm {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px; font-weight: 700;
  width: 68px; flex-shrink: 0;
}

/* SCORE TILES — like arcade score readout */
.score-tile {
  display: inline-block;
  background: var(--void);
  border: 2px solid var(--rail2);
  border-radius: 3px;
  padding: 3px 8px;
  font-family: 'Orbitron', sans-serif;
  font-size: 13px; font-weight: 700;
  margin: 2px;
  color: var(--text2);
  box-shadow: inset 0 0 6px rgba(0,0,0,0.5);
}
.score-tile.lit {
  border-color: var(--neon-g2);
  color: var(--neon-g);
  background: rgba(57,255,20,0.06);
  box-shadow: 0 0 8px rgba(57,255,20,0.2), inset 0 0 6px rgba(57,255,20,0.1);
  text-shadow: 0 0 6px var(--neon-g);
}

.hs-ser {
  font-family: 'Orbitron', sans-serif;
  font-size: 15px; font-weight: 900;
  margin-left: auto;
  color: var(--neon-g);
  text-shadow: 0 0 8px var(--neon-g);
}

/* chevron */
.chv { color: var(--dim); font-size: 12px; transition: transform 0.2s; flex-shrink: 0; margin-left: 8px; }

/* ═══════════ FOOTER TICKER ═══════════ */
.footer-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  height: 28px;
  background: var(--void);
  border-top: 2px solid var(--neon-p2);
  display: flex; align-items: center;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(255,0,255,0.12);
}
.footer-bar::before,
.footer-bar::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 40px; z-index: 2;
}
.footer-bar::before { left: 0; background: linear-gradient(90deg, var(--void), transparent); }
.footer-bar::after  { right: 0; background: linear-gradient(-90deg, var(--void), transparent); }

.footer-track {
  display: flex; animation: marquee2 35s linear infinite; white-space: nowrap;
}
@keyframes marquee2 { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.footer-item {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--neon-p);
  padding: 0 32px;
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--neon-p2);
}
.footer-item::before { content: '▶  '; }

/* ═══════════ BLINK ANIMATIONS ═══════════ */
@keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0.3;} }
.blink { animation: blink 1.2s step-start infinite; }

/* ═══════════ PIXEL DIVIDER ═══════════ */
.px-divider {
  height: 4px;
  background: repeating-linear-gradient(90deg, var(--neon-g2) 0px, var(--neon-g2) 4px, transparent 4px, transparent 8px);
  opacity: 0.35;
  margin: 24px 0;
}
</style>
</head>
<body>

<!-- TOP MARQUEE -->
<div class="marquee-wrap">
  <div class="marquee-track" id="topMarquee"></div>
</div>

<!-- HEADER -->
<div class="site-header">
  <div class="header-inner">
    <div class="logo-wrap">
      <div class="logo-line1">ALLEY</div>
      <div class="logo-line1" style="margin-top:-2px;">RHYTHM</div>
      <div class="logo-line2" id="leagueNameDisplay">Bowling Stats</div>
    </div>
    <div class="header-readouts">
      <div class="readout">
        <div class="readout-val" id="hdr-avg">—</div>
        <div class="readout-lbl">AVG</div>
      </div>
      <div class="readout">
        <div class="readout-val hot" id="hdr-high">—</div>
        <div class="readout-lbl">HIGH</div>
      </div>
    </div>
    <div class="header-spacer"></div>
    <button class="insert-btn" onclick="window.location.href='upload.html'">📸 UPLOAD<br>SCORE</button>
  </div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <div class="nav-inner">
    <button class="ntab active" onclick="goTab('stats',this)">STATS</button>
    <button class="ntab" onclick="goTab('leaders',this)">HIGH SCORES</button>
    <button class="ntab" onclick="goTab('weekly',this)">WEEKLY</button>
    <button class="ntab" onclick="goTab('history',this)">HISTORY</button>
    <a href="upload.html" style="padding:12px 18px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--neon-g);text-decoration:none;white-space:nowrap;display:flex;align-items:center;margin-left:auto;">📸 UPLOAD</a>
    <a href="admin.html" style="padding:12px 18px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--neon-r);text-decoration:none;white-space:nowrap;display:flex;align-items:center;">⚙ ADMIN</a>
  </div>
</div>

<!-- ══════════ STATS VIEW ══════════ -->
<div id="tab-stats" class="view active">
<div class="page">

  <div class="filter-row">
    <div class="fcoin active">ALL TIME</div>
    <div class="fcoin">LAST 8 WKS</div>
    <div class="fcoin">LAST 4 WKS</div>
    <div class="fcoin">THIS WEEK</div>
  </div>

  <div class="scoreboard-strip">
    <div class="score-box">
      <div class="sb-num" id="stat-avg">—</div>
      <div class="sb-lbl">GROUP<br>AVG</div>
    </div>
    <div class="score-box b-p">
      <div class="sb-num" id="stat-high">—</div>
      <div class="sb-lbl">HIGH<br>GAME</div>
    </div>
    <div class="score-box b-y">
      <div class="sb-num" id="stat-sessions">—</div>
      <div class="sb-lbl">SESSIONS<br>PLAYED</div>
    </div>
    <div class="score-box b-c">
      <div class="sb-num" id="stat-games">—</div>
      <div class="sb-lbl">GAMES<br>BOWLED</div>
    </div>
  </div>

  <div class="sec-head">
    <span class="sec-title">▶ PLAYER RANKINGS</span>
    <div class="sec-line"></div>
  </div>

  <div class="player-list">
    <div class="pl-header">
      <div class="pl-hcell">#</div>
      <div class="pl-hcell">PLAYER</div>
      <div class="pl-hcell">AVG</div>
      <div class="pl-hcell ph-hide">BEST</div>
      <div class="pl-hcell ph-hide">SPS%</div>
      <div class="pl-hcell ph-hide">MPH</div>
      <div class="pl-hcell">TREND</div>
    </div>
    <div id="playerRows"></div>
  </div>

</div>
</div>

<!-- ══════════ HIGH SCORES VIEW ══════════ -->
<div id="tab-leaders" class="view">
<div class="page">

  <div class="filter-row">
    <div class="fcoin active">ALL TIME</div>
    <div class="fcoin">LAST 4 WKS</div>
    <div class="fcoin">THIS WEEK</div>
  </div>

  <div class="sec-head">
    <span class="sec-title">▶ HIGH SCORE TABLE</span>
    <div class="sec-line"></div>
  </div>

  <div class="lb-arcade-grid" id="lbGrid"></div>

</div>
</div>

<!-- ══════════ WEEKLY VIEW ══════════ -->
<div id="tab-weekly" class="view">
<div class="page">
  <div class="sec-head">
    <span class="sec-title">▶ WEEKLY RESULTS</span>
    <div class="sec-line"></div>
  </div>
  <div id="weeklyPanels"></div>
</div>
</div>

<!-- ══════════ HISTORY VIEW ══════════ -->
<div id="tab-history" class="view">
<div class="page">
  <div class="sec-head">
    <span class="sec-title">▶ GAME HISTORY</span>
    <div class="sec-line"></div>
  </div>
  <div id="histPanels"></div>
</div>
</div>

<!-- FOOTER TICKER -->
<div class="footer-bar">
  <div class="footer-track" id="footerTrack"></div>
</div>

<script src="config.js"></script>
<script>
/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
const COLORS = ['#ffb830','#39ff14','#ff3d6b','#00ffff','#b87eff','#ff6600','#00e5ff','#ff00ff'];
function pColor(name){
  if(!name) return '#39ff14';
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))&0xffffffff;
  return COLORS[Math.abs(h)%COLORS.length];
}
function ini2(n){ return (n||'??').slice(0,2).toUpperCase(); }

function goTab(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

function emptyState(msg){
  return `<div style="text-align:center;padding:48px 20px;">
    <div style="font-size:36px;margin-bottom:14px;">🎳</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--dim);letter-spacing:1px;line-height:1.8;">${msg}</div>
    <div style="margin-top:18px;">
      <button onclick="window.location.href='upload.html'"
        style="background:var(--neon-g);color:var(--void);border:none;border-radius:4px;padding:10px 22px;
               font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:1px;cursor:pointer;
               box-shadow:0 0 16px rgba(57,255,20,.3),3px 3px 0 var(--neon-g2);">
        📸 UPLOAD FIRST SCORE
      </button>
    </div>
  </div>`;
}

function loadingState(){
  return `<div style="text-align:center;padding:40px 20px;">
    <div style="width:40px;height:40px;border:3px solid var(--rail2);border-top-color:var(--neon-g);
                border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;
                box-shadow:0 0 16px rgba(57,255,20,.2);"></div>
    <div style="font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);letter-spacing:1px;">LOADING...</div>
  </div>`;
}

/* ════════════════════════════════════════
   API
════════════════════════════════════════ */
const SCRIPT_URL = (window.LANE_CONFIG && LANE_CONFIG.SCRIPT_URL && !LANE_CONFIG.SCRIPT_URL.includes('PASTE_YOUR'))
  ? LANE_CONFIG.SCRIPT_URL
  : 'https://script.google.com/macros/s/AKfycbyC94fiIbIMsXxUKT-hD1Wxcq8nj2apLHeYugxPdcYelvQ3WlwZMmMbOfkN_N_eOE1yJQ/exec';

async function apiFetch(action){
  const r = await fetch(`${SCRIPT_URL}?action=${action}`);
  if(!r.ok) throw new Error('API error '+r.status);
  return r.json();
}

/* ════════════════════════════════════════
   MARQUEE — static defaults, updated after load
════════════════════════════════════════ */
function buildMarquee(items){
  const doubled = [...items,...items];
  return doubled.map(t=>`<span class="marquee-item">${t}</span>`).join('');
}

// Apply config-driven branding on load
document.getElementById('leagueNameDisplay').textContent = (LANE_CONFIG.LEAGUE_NAME || 'Bowling Stats').toUpperCase();
document.title = (LANE_CONFIG.SITE_NAME || 'Alley Rhythm') + ' — Stats';

const defaultTicker = [
  LANE_CONFIG.SITE_NAME || 'ALLEY RHYTHM',
  'UPLOAD YOUR SCORES',
  (LANE_CONFIG.LEAGUE_NAME || 'BOWLING CREW').toUpperCase(),
  'BOWLING STATS TRACKER',
  'UPLOAD A SCORE TO GET STARTED',
  `MEETS EVERY ${(LANE_CONFIG.LEAGUE_DAY || 'WEEK').toUpperCase()}`
];
document.getElementById('topMarquee').innerHTML = buildMarquee(defaultTicker);

const footItems = [
  `© ${(LANE_CONFIG.SITE_NAME || 'ALLEY RHYTHM').toUpperCase()}  ·  SEASON STATS`,
  'UPLOAD SCORES AFTER EACH SESSION',
  `WEEKLY EMAIL DIGEST EVERY MONDAY`,
  `${(LANE_CONFIG.LEAGUE_NAME || 'THE CREW').toUpperCase()} · ${(LANE_CONFIG.LEAGUE_DAY || 'WEEKLY').toUpperCase()} SESSIONS`
];
document.getElementById('footerTrack').innerHTML = buildMarquee(footItems);

/* ════════════════════════════════════════
   LOAD ALL DATA ON PAGE LOAD
════════════════════════════════════════ */
let liveStats = null;
let liveHistory = null;
let liveWeekly = null;

async function loadAll(){
  try {
    // Parallel fetch
    const [stats, history, weekly] = await Promise.all([
      apiFetch('stats'),
      apiFetch('history'),
      apiFetch('weekly'),
    ]);
    liveStats   = stats;
    liveHistory = history;
    liveWeekly  = weekly;

    renderStats(stats);
    renderLeaders(stats);
    renderWeekly(weekly);
    renderHistory(history);
    updateHeaderAndMarquee(stats);
  } catch(e) {
    console.error('Failed to load data:', e);
    // Show empty states on error
    document.getElementById('playerRows').innerHTML =
      `<div style="padding:20px;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--neon-r);text-align:center;">
        Could not connect to server.<br>Check your SCRIPT_URL in config.js.
      </div>`;
  }
}

/* ════════════════════════════════════════
   UPDATE HEADER READOUTS + MARQUEE
════════════════════════════════════════ */
function updateHeaderAndMarquee(stats){
  const bowlers = stats.bowlers || [];
  if(!bowlers.length) return;

  const allGames = bowlers.flatMap(b => b.recentGames || []);
  const groupAvg = allGames.length ? Math.round(allGames.reduce((a,b)=>a+b,0)/allGames.length) : 0;
  const highGame = Math.max(...bowlers.map(b=>b.highGame||0));

  document.getElementById('hdr-avg').textContent  = groupAvg || '—';
  document.getElementById('hdr-high').textContent = highGame || '—';
  document.getElementById('stat-avg').textContent  = groupAvg || '—';
  document.getElementById('stat-high').textContent = highGame || '—';
  document.getElementById('stat-sessions').textContent = liveHistory?.sessions?.length || '—';
  document.getElementById('stat-games').textContent    = bowlers.reduce((s,b)=>s+b.gamesCount,0) || '—';

  // Build live marquee from real data + config
  const leader = [...bowlers].sort((a,z)=>z.avg-a.avg)[0];
  const highSeries = Math.max(...bowlers.map(b=>b.highSeries||0));
  const items = [
    `${(LANE_CONFIG.SITE_NAME||'ALLEY RHYTHM').toUpperCase()} · SEASON STATS`,
    leader ? `${leader.name.toUpperCase()} LEADS · ${leader.avg} AVG` : null,
    highGame ? `HIGH GAME THIS SEASON: ${highGame}` : null,
    `${bowlers.length} PLAYERS TRACKED`,
    highSeries ? `BEST SERIES: ${highSeries}` : null,
    `UPLOAD SCORES AFTER EACH SESSION`,
    `${(LANE_CONFIG.LEAGUE_NAME||'THE CREW').toUpperCase()} · EVERY ${(LANE_CONFIG.LEAGUE_DAY||'WEEK').toUpperCase()}`,
  ].filter(Boolean);

  document.getElementById('topMarquee').innerHTML = buildMarquee(items);
}

/* ════════════════════════════════════════
   STATS TAB
════════════════════════════════════════ */
function renderStats(stats){
  const bowlers = stats.bowlers || [];
  const el = document.getElementById('playerRows');

  if(!bowlers.length){
    el.innerHTML = emptyState('NO GAMES YET<br>UPLOAD YOUR FIRST SCORE SCREEN');
    return;
  }

  const sorted = [...bowlers].sort((a,z)=>z.avg-a.avg);
  const rankClass = ['r1','r2','r3','','','','','',''];

  el.innerHTML = sorted.map((p,i)=>{
    const c = pColor(p.name);
    const trend = p.recentGames || [];
    const mx = trend.length ? Math.max(...trend) : 200;
    const mn = trend.length ? Math.min(...trend) : 100;
    const bars = trend.slice(-7).map(v=>{
      const h = Math.max(4, Math.round(5+((v-mn)/Math.max(mx-mn,1))*22));
      const cls = v===mx ? 'top' : v>(p.avg||0) ? 'pos' : '';
      return `<div class="spk ${cls}" style="height:${h}px"></div>`;
    }).join('');

    const spare = p.sparePct !== null && p.sparePct !== undefined
      ? p.sparePct + '%'
      : (p.strikes + p.spares) > 0
        ? Math.round((p.spares / (p.spares + p.strikes)) * 100) + '%'
        : '—';
    const speed = p.avgSpeed ? p.avgSpeed : '—';

    return `<div class="pl-row">
      <div class="pl-rank ${rankClass[i]||''}">${i+1}</div>
      <div class="pl-bowler">
        <div class="px-av" style="background:${c}12;border-color:${c};color:${c};">${ini2(p.name)}</div>
        <div>
          <div class="pl-name" style="color:${c};text-shadow:0 0 8px ${c}66;">${p.name.toUpperCase()}</div>
          <div class="pl-sub">${p.gamesCount||0} games</div>
        </div>
      </div>
      <div class="pl-num hi">${p.avg||'—'}</div>
      <div class="pl-num ph-hide">${p.highGame||'—'}</div>
      <div class="pl-num ph-hide">${spare}</div>
      <div class="pl-num ph-hide">${speed}</div>
      <div class="spark-bars">${bars||'<span style="color:var(--dim);font-size:10px;">—</span>'}</div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   LEADERS TAB
════════════════════════════════════════ */
function renderLeaders(stats){
  const bowlers = stats.bowlers || [];
  const el = document.getElementById('lbGrid');

  if(!bowlers.length){
    el.innerHTML = emptyState('NO DATA YET<br>UPLOAD SCORES TO SEE LEADERBOARD');
    return;
  }

  const posCls = ['p1','p2','p3','','',''];
  const lbCats = [
    { icon:'🏆', title:'SEASON AVG',  rows:[...bowlers].sort((a,z)=>z.avg-a.avg).map(p=>({n:p.name,c:pColor(p.name),v:p.avg})) },
    { icon:'🎯', title:'HIGH GAME',   rows:[...bowlers].sort((a,z)=>z.highGame-a.highGame).map(p=>({n:p.name,c:pColor(p.name),v:p.highGame})) },
    { icon:'💥', title:'BEST SERIES', rows:[...bowlers].sort((a,z)=>z.highSeries-a.highSeries).map(p=>({n:p.name,c:pColor(p.name),v:p.highSeries||0})) },
    { icon:'🎳', title:'SPARE %',     rows:[...bowlers]
        .filter(p=>(p.strikes||0)+(p.spares||0)>0)
        .sort((a,z)=>(z.spares/(z.spares+z.strikes))-(a.spares/(a.spares+a.strikes)))
        .map(p=>({n:p.name,c:pColor(p.name),v:Math.round(p.spares/(p.spares+p.strikes)*100)+'%'})) },
  ];

  el.innerHTML = lbCats.map(cat=>`
    <div class="lb-cabinet">
      <div class="lb-cab-header">
        <span class="lb-cab-icon">${cat.icon}</span>
        <span class="lb-cab-title">${cat.title}</span>
      </div>
      ${cat.rows.slice(0,6).map((r,i)=>`
      <div class="lb-entry">
        <div class="lb-pos ${posCls[i]||''}">${['01','02','03','04','05','06'][i]}</div>
        <div class="lb-dot" style="background:${r.c};box-shadow:0 0 8px ${r.c};"></div>
        <div class="lb-nm" style="color:${r.c};text-shadow:0 0 6px ${r.c}44;">${r.n.toUpperCase()}</div>
        <div class="lb-score" style="color:${r.c};text-shadow:0 0 8px ${r.c}66;">${r.v}</div>
      </div>`).join('')}
    </div>`).join('');
}

/* ════════════════════════════════════════
   WEEKLY TAB
════════════════════════════════════════ */
function renderWeekly(weekly){
  const weeks = weekly.weeks || [];
  const el = document.getElementById('weeklyPanels');

  if(!weeks.length){
    el.innerHTML = emptyState('NO WEEKLY DATA YET<br>UPLOAD SCORES TO START TRACKING');
    return;
  }

  el.innerHTML = [...weeks].reverse().map((w,i)=>`
    <div class="wk-panel ${i===0?'wo':''}">
      <div class="wk-top" onclick="this.parentElement.classList.toggle('wo')">
        <div>
          <div class="wk-week-label">${w.week}</div>
          <div class="wk-meta">HIGH GAME: ${w.highGame}  //  ${w.bowlers.length} PLAYERS</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div>
            <div class="wk-avg-display">${w.groupAvg}</div>
            <div class="wk-avg-lbl">GRP AVG</div>
          </div>
          <span class="chv">▾</span>
        </div>
      </div>
      <div class="wk-body">
        ${w.bowlers.map(b=>`
        <div class="wk-prow">
          <div class="wk-pname" style="color:${pColor(b.name)};text-shadow:0 0 6px ${pColor(b.name)}55;">${b.name.toUpperCase()}</div>
          <div class="wk-pgames">${b.games.join('  ·  ')}</div>
          <div class="wk-pavg" style="${b.avg>=200?'color:var(--neon-g);text-shadow:0 0 8px var(--neon-g);':''}">${b.avg}</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ════════════════════════════════════════
   HISTORY TAB
════════════════════════════════════════ */
function renderHistory(history){
  const sessions = history.sessions || [];
  const el = document.getElementById('histPanels');

  if(!sessions.length){
    el.innerHTML = emptyState('NO SESSIONS YET<br>UPLOAD YOUR FIRST SCORE SCREEN');
    return;
  }

  el.innerHTML = sessions.map((s,i)=>{
    const bowlers = s.bowlers || [];
    const pins = bowlers.reduce((sum,b)=>sum+(b.series||0),0);
    return `<div class="hs-panel ${i===0?'ho':''}">
      <div class="hs-top" onclick="this.parentElement.classList.toggle('ho')">
        <div>
          <div class="hs-date" style="color:${i===0?'var(--neon-g)':'var(--text)'};">${s.date}${s.teamName?'  //  '+s.teamName:''}</div>
          <div class="hs-meta">${bowlers.length} PLAYERS  ·  ${pins} TOTAL PINS</div>
        </div>
        <span class="chv">▾</span>
      </div>
      <div class="hs-body">
        ${bowlers.map(b=>`
        <div class="hs-prow">
          <div class="hs-nm" style="color:${pColor(b.matchedName||b.name)};text-shadow:0 0 6px ${pColor(b.matchedName||b.name)}44;">${(b.matchedName||b.name||'').toUpperCase()}</div>
          <div style="flex:1;">${(b.games||[]).map(g=>`<span class="score-tile ${g>=200?'lit':''}">${g}</span>`).join('')}</div>
          <div class="hs-ser">${b.series||''}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════
   INIT — show loading states then fetch
════════════════════════════════════════ */
document.getElementById('playerRows').innerHTML = loadingState();
document.getElementById('lbGrid').innerHTML = loadingState();
document.getElementById('weeklyPanels').innerHTML = loadingState();
document.getElementById('histPanels').innerHTML = loadingState();

loadAll();
</script>
</body>
</html>
